name: Release do Mac
# Dispara quando uma tag v* é criada (por exemplo v0.4.18). Gera o app para Mac e põe os arquivos dele na
# release dessa tag, ao lado dos do Windows. Mac e Windows dividem a mesma versão e a mesma release (ver RELEASE.md).
on:
  push:
    tags: ["v*"]
  # Para refazer a parte do Mac de uma versão já publicada: Actions, "Release do Mac", Run workflow,
  # informando a tag (por exemplo v0.4.18). Roda o código do ramo escolhido.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (por exemplo v0.4.18)"
        required: true
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest # macos-14 não é aceito nesta conta (PR #2)
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confere a versão
        # a tag precisa ser a versão do app/package.json: o app só aceita pacote da versão da release
        run: |
          VERSAO=$(node -p "require('./app/package.json').version")
          if [ "v${VERSAO}" != "${TAG}" ]; then
            echo "A tag ${TAG} não bate com a versão ${VERSAO} do app/package.json"; exit 1
          fi
      - run: npm ci
        working-directory: design-system
      - run: npm ci
        working-directory: app
      - name: Compila o ajudante de voz
        working-directory: app
        run: swiftc -O native/fala.swift -o native/fala -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker native/Info.plist
      - name: Empacota o app
        working-directory: app
        env:
          SEM_INSTALAR: "1"
        run: npm run empacotar
      - name: Confere que o app abre
        # o app empacotado precisa abrir (o banco local é um módulo nativo e já saiu errado uma vez, na 1.0.0)
        working-directory: app
        run: |
          APP="dist-app/TekaFlow-darwin-arm64/TekaFlow.app/Contents/MacOS/TekaFlow"
          TEKA_LOG_VERSAO=1 "$APP" --user-data-dir="$RUNNER_TEMP/teka-teste" > "$RUNNER_TEMP/abertura.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do sleep 1; grep -q "TEKA_VERSAO\|NODE_MODULE_VERSION" "$RUNNER_TEMP/abertura.txt" && break; done
          kill $PID 2>/dev/null || true
          head -20 "$RUNNER_TEMP/abertura.txt"
          grep -q "TEKA_VERSAO" "$RUNNER_TEMP/abertura.txt"
      - name: Põe os arquivos do Mac na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O Robert cria a release com os arquivos do Windows (e a tag junto). Se ela ainda não existe,
          # cria sem marcar como a mais recente, para não esconder a versão do Windows: quem publicar o
          # Windows depois marca a release como a mais recente.
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --latest=false --title "TekaFlow ${TAG#v}" --notes-file "docs/releases/${TAG}.md"
          fi
          gh release upload "${TAG}" app/release/*.zip app/release/*.asar app/release/tekaflow-mac-update.json --clobber
