name: Gate
# Tipos e build da tela a cada push e pull request. O harness do design system e o detector de design
# moram nas skills locais do Carlos e rodam no gancho de pre-commit (scripts/gate.mjs).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
        working-directory: design-system
      - run: node scripts/gate.mjs
