<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TekaFlow, pronto</title>
<style>
/* Cores do app: fundo grafite, texto claro, limão da marca. Sem fonte nem arquivo externo: esta página é servida pelo próprio app. */
:root{--bg:#1A1B1E;--fg:#FFFFFF;--mut:#A3A4A8;--lim:#C5EF6B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 "Figtree",-apple-system,system-ui,sans-serif;padding:32px;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center}
.gato{position:relative;width:96px;height:96px;color:var(--lim);animation:sobe .7s cubic-bezier(.16,1,.3,1) both}
.gato svg{position:relative;width:100%;height:100%;display:block}
/* As ondas em quadradinho saem do gato uma vez e somem: o único movimento da tela */
.onda{position:absolute;inset:0;border:1.5px solid var(--lim);border-radius:29%;opacity:0;animation:onda 3.2s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.5s + var(--i) * .4s)}
h1{margin:0;font:500 clamp(28px,5vw,40px)/1.15 "Outfit","Figtree",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance;animation:sobe .7s .15s cubic-bezier(.16,1,.3,1) both}
p{margin:0;color:var(--mut);animation:sobe .7s .25s cubic-bezier(.16,1,.3,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes onda{0%{opacity:.3;transform:scale(1)}100%{opacity:0;transform:scale(4.4)}}
@media (prefers-reduced-motion:reduce){.gato,h1,p{animation:none}.onda{display:none}}
</style>
</head>
<body>
<main>
  <div class="gato" role="img" aria-label="TekaFlow">
    <i class="onda" style="--i:0"></i><i class="onda" style="--i:1"></i><i class="onda" style="--i:2"></i>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2.9 10 10" aria-hidden="true"><defs><mask id="gato" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16"><rect width="16" height="16" fill="#000"/><g transform="translate(0 .25)"><path d="M4 6L4.5 3.5L7 5H9L11.5 3.5L12 6V10A2 2 0 0 1 10 12H6A2 2 0 0 1 4 10Z" fill="#fff" stroke="#fff" stroke-width=".5" stroke-linejoin="round"/><path d="M5.2 8Q6 6.8 6.8 8" fill="none" stroke="#000" stroke-width=".55" stroke-linecap="round"/><path d="M9.2 8Q10 6.8 10.8 8" fill="none" stroke="#000" stroke-width=".55" stroke-linecap="round"/><rect x="6.725" y="9.5" width=".55" height="1" rx=".275" fill="#000"/><rect x="7.725" y="9.15" width=".55" height="1.7" rx=".275" fill="#000"/><rect x="8.725" y="9.5" width=".55" height="1" rx=".275" fill="#000"/><path d="M4.95 5.8L5.05 4.8L6.15 5.4Z" fill="#000" stroke="#000" stroke-width=".25" stroke-linejoin="round"/><path d="M11.05 5.8L10.95 4.8L9.85 5.4Z" fill="#000" stroke="#000" stroke-width=".25" stroke-linejoin="round"/></g></mask></defs><rect width="16" height="16" fill="currentColor" mask="url(#gato)"/></svg>
  </div>
  <h1>Pronto. Pode voltar ao TekaFlow.</h1>
  <p>Você já pode fechar esta aba.</p>
</main>
</body>
</html>
